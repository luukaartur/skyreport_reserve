<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доповіді</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --success-color: #28a745;
            --success-hover: #218838;
            --border-color: #cccccc;
            --accent-bg: #e9ecef;
            --danger-color: #dc3545;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #e0e0e0;
                --primary-color: #375a7f;
                --primary-hover: #2b4764;
                --success-color: #2ea44f;
                --success-hover: #227d3b;
                --border-color: #444444;
                --accent-bg: #2d2d2d;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .inline-row {
            display: flex;
            gap: 10px;
        }

        .inline-row > div {
            flex: 1;
        }

        /* Перемикачі типу доповіді */
        .main-type-container {
            margin-bottom: 20px;
        }
        
        .main-type-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
        }

        .main-type-btn {
            padding: 14px;
            background-color: var(--accent-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }

        .main-type-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 3px 6px rgba(0,123,255,0.2);
        }

        .main-type-subgrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* Блок часу */
        .time-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .time-inputs-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .time-inputs-wrapper input {
            width: 54px;
            padding: 10px 2px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1.05rem;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        .time-inputs-wrapper span {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .time-btn-group {
            display: flex;
            gap: 6px;
            flex: 1;
            justify-content: flex-end;
        }

        .btn-adj {
            padding: 10px 12px;
            font-size: 0.95rem;
            font-weight: bold;
            background-color: var(--accent-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            cursor: pointer;
            min-width: 44px;
            text-align: center;
        }
        
        .btn-adj:active {
            background-color: var(--border-color);
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
        }

        textarea {
            resize: vertical;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.9rem;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn-group-toggle {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .toggle-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            background-color: var(--accent-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .toggle-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toggle-btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-blue { background-color: var(--primary-color); color: white; }
        .btn-blue:active:not(:disabled) { background-color: var(--primary-hover); }
        .btn-green { background-color: var(--success-color); color: white; }
        .btn-green:active:not(:disabled) { background-color: var(--success-hover); }
        
        .btn-clear { background-color: #6c757d; color: white; margin-top: 8px; padding: 10px; }
        .btn-clear:active { background-color: #5a6268; }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
            background-color: var(--accent-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: auto;
            display: inline-block;
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            min-width: 40px;
        }

        .dynamic-section {
            display: none;
        }

        .header-box {
            background: rgba(0, 123, 255, 0.04);
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed var(--primary-color);
            margin-bottom: 15px;
        }

        .result-box {
            display: none;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed var(--border-color);
        }

        .result-box textarea {
            background: rgba(0, 0, 0, 0.02);
            font-family: monospace;
            font-size: 1rem;
            height: 360px;
            resize: none;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        @media (prefers-color-scheme: dark) {
            .result-box textarea { background: rgba(255, 255, 255, 0.04); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Модальне вікно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-card {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }

        .modal-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--primary-color);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="main-type-container">
        <label>Оберіть тип доповіді:</label>
        <div class="main-type-grid">
            <button type="button" class="main-type-btn" id="mbtn_use" onclick="setMainReportType('use')">🔫 Застосування</button>
            <div class="main-type-subgrid">
                <button type="button" class="main-type-btn" id="mbtn_flight" onclick="setMainReportType('flight')">✈️ Проліт</button>
                <button type="button" class="main-type-btn active" id="mbtn_other" onclick="setMainReportType('other')">🎇 Інше</button>
            </div>
        </div>
        <input type="hidden" id="report_type" value="other">
    </div>

    <div class="header-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0;">
            <div class="section-title" style="margin: 0; color: #cc8b00; border-bottom: none;">📌 Постійна шапка (пам'ять)</div>
            <button type="button" class="btn-small" id="header_toggle_btn" onclick="toggleHeaderManual()" style="padding: 6px 12px; margin: 0; min-width: 90px;">Розгорнути</button>
        </div>
        
        <div id="header_content" style="display: none;">
            <div class="inline-row" style="margin-top: 8px;">
                <div class="form-group">
                    <label for="h_np">Н.П.:</label>
                    <input type="text" id="h_np" value="КИЇВ" placeholder="КИЇВ" oninput="this.value = this.value.toUpperCase(); saveHeader();" style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label for="h_obl">Обл.:</label>
                    <input type="text" id="h_obl" value="Київська" placeholder="наприклад, Київська" oninput="saveHeader()">
                </div>
            </div>
            <div class="inline-row">
                <div class="form-group">
                    <label for="h_unit">Підрозділ:</label>
                    <input type="text" id="h_unit" placeholder="наприклад, 1 ОБ" oninput="saveHeader()">
                </div>
                <div class="form-group">
                    <label for="h_callsign">Позивний:</label>
                    <input type="text" id="h_callsign" placeholder="наприклад, Гром" oninput="saveHeader()">
                </div>
            </div>
            <div class="form-group">
                <label for="h_soldiers">Військовослужбовці:</label>
                <textarea id="h_soldiers" rows="2" placeholder="Склад розрахунку / екіпажу..." oninput="saveHeader()"></textarea>
            </div>
            
            <div id="weapons_container"></div>
            <button type="button" class="btn-small" style="margin-top: 4px;" onclick="addWeaponRow()">➕ Додати зброю</button>
        </div>
    </div>

    <div class="section-title">📝 Дані доповіді</div>

    <div class="form-group">
        <label for="f_date">Дата:</label>
        <input type="text" id="f_date">
    </div>

    <div class="form-group">
        <label>Час:</label>
        <div class="time-container">
            <div class="time-inputs-wrapper">
                <input type="number" id="f_hour" placeholder="00" min="0" max="23">
                <span>:</span>
                <input type="number" id="f_min" placeholder="00" min="0" max="59">
            </div>
            <div class="time-btn-group">
                <button type="button" class="btn-adj" onclick="adjustMin(-1)">-1</button>
                <button type="button" class="btn-adj" onclick="adjustMin(1)">+1</button>
                <button type="button" class="btn-small" style="padding: 10px 12px; white-space: nowrap; height: 42px;" onclick="setCurrentTimeOnly()">ЩОЙНО</button>
            </div>
        </div>
    </div>

    <div class="form-group" id="target_num_wrapper">
        <label for="f_target_num">№ цілі:</label>
        <input type="number" id="f_target_num" placeholder="Тільки цифри" inputmode="numeric" pattern="[0-9]*">
        <div class="checkbox-group">
            <input type="checkbox" id="f_target_bv" onchange="toggleTargetBV()">
            <label for="f_target_bv">Ціль б/в (без відмітки)</label>
        </div>
    </div>

    <div id="branch_use" class="dynamic-section">
        <div class="form-group">
            <label>Результат (обов’язково):</label>
            <div class="btn-group-toggle">
                <button type="button" class="toggle-btn" id="btn_u_res_destroyed" onclick="setUseResult('Знищено')">Знищено</button>
                <button type="button" class="toggle-btn" id="btn_u_res_not_destroyed" onclick="setUseResult('Не знищено')">Не знищено</button>
            </div>
            <input type="hidden" id="u_result" value="">
        </div>
        
        <div class="form-group">
            <label>Тип цілі:</label>
            <div class="btn-group-toggle">
                <button type="button" class="toggle-btn active" id="btn_u_shahed" onclick="setTargetType('use', 'Шахед')">Шахед</button>
                <button type="button" class="toggle-btn" id="btn_u_gerbera" onclick="setTargetType('use', 'Гербера')">Гербера</button>
                <button type="button" class="toggle-btn" id="btn_u_rocket" onclick="setTargetType('use', 'Ракета')">Ракета</button>
            </div>
        </div>

        <div class="form-group">
            <label for="u_height">Висота:</label>
            <input type="number" id="u_height" placeholder="наприклад, 120" inputmode="numeric" pattern="[0-9]*">
        </div>

        <div class="form-group">
            <label>Параметри опису:</label>
            <div class="inline-row">
                <input type="number" id="u_azi" placeholder="Азимут" inputmode="numeric" pattern="[0-9]*">
                <input type="number" id="u_dist" placeholder="Дальність" inputmode="numeric" pattern="[0-9]*">
                <input type="number" id="u_course" placeholder="Курс" inputmode="numeric" pattern="[0-9]*">
            </div>
        </div>

        <div id="u_ammo_inputs_container"></div>
    </div>

    <div id="branch_flight" class="dynamic-section">
        <div class="form-group">
            <input type="hidden" id="fl_result" value="Виявлено">
            <label>Спосіб виявлення:</label>
            <div class="checkbox-group" style="margin-top: 0;">
                <input type="checkbox" id="fl_acous" checked> <label for="fl_acous">акустично</label>
                <input type="checkbox" id="fl_vis"> <label for="fl_vis">візуально</label>
            </div>
        </div>

        <div class="form-group">
            <label>Тип цілі:</label>
            <div class="btn-group-toggle">
                <button type="button" class="toggle-btn active" id="btn_fl_shahed" onclick="setTargetType('flight', 'Шахед')">Шахед</button>
                <button type="button" class="toggle-btn" id="btn_fl_gerbera" onclick="setTargetType('flight', 'Гербера')">Гербера</button>
                <button type="button" class="toggle-btn" id="btn_fl_rocket" onclick="setTargetType('flight', 'Ракета')">Ракета</button>
            </div>
        </div>

        <div class="form-group">
            <label>Параметри опису та висота:</label>
            <div class="inline-row" style="gap: 5px;">
                <input type="number" id="fl_azi" placeholder="Азимут" inputmode="numeric" pattern="[0-9]*">
                <input type="number" id="fl_dist" placeholder="Дальність" inputmode="numeric" pattern="[0-9]*">
                <input type="number" id="fl_course" placeholder="Курс" inputmode="numeric" pattern="[0-9]*">
                <input type="number" id="fl_height" placeholder="Висота" inputmode="numeric" pattern="[0-9]*">
            </div>
        </div>
    </div>

    <div id="branch_other" class="dynamic-section" style="display: block;">
        <div class="form-group">
            <label>Тип того, що побачили:</label>
            <div class="toggle-btn-grid" id="other_types_grid">
                <button type="button" class="toggle-btn active" id="btn_o_vibuh" onclick="setOtherType('Вибух')">Вибух</button>
                <button type="button" class="toggle-btn" id="btn_o_ppo" onclick="setOtherType('Вихід ППО')">Вихід ППО</button>
                <button type="button" class="toggle-btn" id="btn_o_pzrk" onclick="setOtherType('Вихід ПЗРК')">Вихід ПЗРК</button>
                <button type="button" class="toggle-btn" id="btn_o_zu" onclick="setOtherType('Робота ЗУ')">Робота ЗУ</button>
                <button type="button" class="toggle-btn" id="btn_o_kul" onclick="setOtherType('Робота Кулемета')">Робота Кулемета</button>
                <button type="button" class="toggle-btn" id="btn_o_pril" onclick="setOtherType('Влучання')">Влучання</button>
                <button type="button" class="toggle-btn" id="btn_o_plane" onclick="setOtherType('Свій Літак')">Свій Літак</button>
                <button type="button" class="toggle-btn" id="btn_o_heli" onclick="setOtherType('Свій гелікоптер')">Свій гелікоптер</button>
                <button type="button" class="toggle-btn" id="btn_o_nasl" onclick="setOtherType('Наслідки')">Наслідки</button>
            </div>
        </div>

        <div class="form-group" id="o_target_num_wrapper" style="display: block;">
            <label for="o_target_num">№ цілі:</label>
            <input type="number" id="o_target_num" placeholder="Тільки цифри" inputmode="numeric" pattern="[0-9]*">
        </div>

        <div class="form-group" id="o_naslidki_wrapper" style="display: none;">
            <label for="o_naslidki_text">Назва наслідку (текстом):</label>
            <input type="text" id="o_naslidki_text" placeholder="наприклад, Пожежа або задимлення">
        </div>

        <div class="form-group" id="o_qty_wrapper" style="display: block;">
            <label for="o_qty">Кількість (шт):</label>
            <input type="number" id="o_qty" placeholder="Тільки цифри" inputmode="numeric" pattern="[0-9]*">
        </div>

        <input type="hidden" id="o_result_static" value="Виявлено">

        <div class="form-group">
            <label>Спосіб виявлення:</label>
            <div class="checkbox-group">
                <input type="checkbox" id="o_acous" checked> <label for="o_acous">акустично</label>
                <input type="checkbox" id="o_vis"> <label for="o_vis">візуально</label>
            </div>
        </div>

        <div class="form-group" id="o_aircraft_number_wrapper" style="display: none;">
            <label for="o_aircraft_number">Номер:</label>
            <input type="number" id="o_aircraft_number" placeholder="Введіть номер (наприклад, 4444)" inputmode="numeric" pattern="[0-9]*">
            <div class="checkbox-group" style="margin-top: 8px;">
                <input type="checkbox" id="o_aircraft_no_issue" onchange="toggleAircraftNoIssue()">
                <label for="o_aircraft_no_issue">Без видачі</label>
            </div>
        </div>

        <div class="form-group">
            <label>Параметри опису:</label>
            <div class="inline-row" style="gap: 5px;">
                <input type="number" id="o_azi" placeholder="Азимут" inputmode="numeric" pattern="[0-9]*">
                <input type="number" id="o_dist" placeholder="Дальність" inputmode="numeric" pattern="[0-9]*">
                <input type="number" id="o_course" placeholder="Курс" inputmode="numeric" pattern="[0-9]*" style="display:none;">
                <input type="number" id="o_height" placeholder="Висота" inputmode="numeric" pattern="[0-9]*" style="display:none;">
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="f_comment">Коментар:</label>
        <input type="text" id="f_comment" placeholder="Вільний текст (якщо порожньо — буде прочерк)">
    </div>

    <button class="btn btn-blue" onclick="buildFinalReport()">Згенерувати звіт</button>
    <button class="btn btn-clear" onclick="resetDynamicFields()">Очистити поля</button>

    <div class="result-box" id="result_block">
        <label for="final_text">📋 Готовий текст:</label>
        <textarea id="final_text" readonly onclick="this.select()"></textarea>
        <button class="btn btn-green" onclick="copyFinalReport()">Скопіювати у буфер</button>
    </div>
</div>

<!-- Модальне вікно для результату "Не знищено" -->
<div id="not_destroyed_modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
        <h3>Обов'язкове уточнення</h3>
        
        <div class="form-group">
            <label>Тип озброєння який застосовували:</label>
            <div class="btn-group-toggle" style="flex-direction: column; gap: 8px;">
                <button type="button" class="toggle-btn" id="m_weapon_vkk" onclick="selectModalWeapon('vkk')">ВКК, ЗУ, та інша стрілецька</button>
                <button type="button" class="toggle-btn" id="m_weapon_pzrk" onclick="selectModalWeapon('pzrk')">ПЗРК</button>
            </div>
        </div>

        <div class="form-group" id="modal_pzrk_reason_group" style="display: none; margin-top: 15px;">
            <label>Чому не вийшло знищити?</label>
            <div class="btn-group-toggle" style="flex-direction: column; gap: 8px;">
                <button type="button" class="toggle-btn" id="m_reason_ndzh" onclick="selectModalReason('ndzh')">Не було захоплення/спалили НДЖ</button>
                <button type="button" class="toggle-btn" id="m_reason_selfdestruct" onclick="selectModalReason('selfdestruct')">Ракета пішла на самознищення</button>
            </div>
        </div>

        <button type="button" class="btn btn-blue" id="modal_ok_btn" disabled onclick="confirmModalSelection()">ОК</button>
    </div>
</div>

<div class="toast" id="toast">Скопійовано!</div>

<script>
    let selectedUseType = "Шахед";
    let selectedFlightType = "Шахед";
    let selectedOtherType = "Вибух";

    // Змінні для модального вікна
    let pendingModalText = "";
    let isNotDestroyedModalFilled = false;

    window.onload = function() {
        loadHeader();
        setCurrentDateTime();
        setMainReportType('other');
    };

    function setMainReportType(type) {
        document.getElementById('report_type').value = type;
        
        document.querySelectorAll('.main-type-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`mbtn_${type}`).classList.add('active');
        
        switchReportBranch();
        
        const headerContent = document.getElementById('header_content');
        const toggleBtn = document.getElementById('header_toggle_btn');
        
        headerContent.style.display = 'none';
        toggleBtn.textContent = 'Розгорнути';
    }

    function toggleHeaderManual() {
        const headerContent = document.getElementById('header_content');
        const toggleBtn = document.getElementById('header_toggle_btn');
        
        if (headerContent.style.display === 'none') {
            headerContent.style.display = 'block';
            toggleBtn.textContent = 'Згорнути';
        } else {
            headerContent.style.display = 'none';
            toggleBtn.textContent = 'Розгорнути';
        }
    }

    function setCurrentDateTime() {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        
        document.getElementById('f_date').value = `${day}.${month}.${year}`;
        setCurrentTimeOnly();
    }

    function setCurrentTimeOnly() {
        const now = new Date();
        document.getElementById('f_hour').value = now.getHours();
        document.getElementById('f_min').value = String(now.getMinutes()).padStart(2, '0');
    }

    function adjustMin(amount) {
        const hrInput = document.getElementById('f_hour');
        const minInput = document.getElementById('f_min');
        
        let hr = parseInt(hrInput.value);
        let mn = parseInt(minInput.value);
        
        if (isNaN(hr)) hr = new Date().getHours();
        if (isNaN(mn)) mn = new Date().getMinutes();
        
        let totalMins = hr * 60 + mn + amount;
        
        if (totalMins < 0) totalMins += 24 * 60;
        totalMins = totalMins % (24 * 60);
        
        hrInput.value = Math.floor(totalMins / 60);
        minInput.value = String(totalMins % 60).padStart(2, '0');
    }

    function addWeaponRow(weaponName = '', ammoName = '') {
        const container = document.getElementById('weapons_container');
        const rowCount = container.children.length;

        const row = document.createElement('div');
        row.className = 'inline-row weapon-row';
        row.style.marginBottom = '8px';
        row.style.alignItems = 'flex-end';

        row.innerHTML = `
            <div class="form-group" style="margin-bottom:0;">
                <label>Назва зброї:</label>
                <input type="text" class="w-name" value="${weaponName}" placeholder="наприклад, ДШК" oninput="saveHeader()">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Набій:</label>
                <input type="text" class="w-ammo" value="${ammoName}" placeholder="наприклад, 12.7 мм" oninput="saveHeader()">
            </div>
            ${rowCount > 0 ? `<button type="button" class="btn-delete" onclick="removeWeaponRow(this)">✕</button>` : `<div style="width:40px; display:none;"></div>`}
        `;
        container.appendChild(row);
        
        if (weaponName === '' && ammoName === '') {
            saveHeader();
        }
    }

    function removeWeaponRow(button) {
        button.closest('.weapon-row').remove();
        saveHeader();
    }

    function saveHeader() {
        localStorage.setItem('h_np', document.getElementById('h_np').value);
        localStorage.setItem('h_obl', document.getElementById('h_obl').value);
        localStorage.setItem('h_unit', document.getElementById('h_unit').value);
        localStorage.setItem('h_callsign', document.getElementById('h_callsign').value);
        localStorage.setItem('h_soldiers', document.getElementById('h_soldiers').value);
        
        const weapons = [];
        document.querySelectorAll('.weapon-row').forEach(row => {
            const name = row.querySelector('.w-name').value;
            const ammo = row.querySelector('.w-ammo').value;
            weapons.push({ name, ammo });
        });
        localStorage.setItem('h_weapons', JSON.stringify(weapons));
        
        updateAmmoInputs();
    }

    function loadHeader() {
        if(localStorage.getItem('h_np') !== null) {
            document.getElementById('h_np').value = localStorage.getItem('h_np').toUpperCase();
        } else {
            document.getElementById('h_np').value = "КИЇВ";
        }
        
        if(localStorage.getItem('h_obl') !== null) {
            document.getElementById('h_obl').value = localStorage.getItem('h_obl');
        } else {
            document.getElementById('h_obl').value = "Київська";
        }

        if(localStorage.getItem('h_unit')) document.getElementById('h_unit').value = localStorage.getItem('h_unit');
        if(localStorage.getItem('h_callsign')) document.getElementById('h_callsign').value = localStorage.getItem('h_callsign');
        if(localStorage.getItem('h_soldiers')) document.getElementById('h_soldiers').value = localStorage.getItem('h_soldiers');
        
        const container = document.getElementById('weapons_container');
        container.innerHTML = '';

        const savedWeapons = localStorage.getItem('h_weapons');
        if (savedWeapons) {
            const weapons = JSON.parse(savedWeapons);
            if (weapons.length === 0) {
                addWeaponRow();
            } else {
                weapons.forEach(w => addWeaponRow(w.name, w.ammo));
            }
        } else {
            addWeaponRow();
        }
        
        updateAmmoInputs();
    }

    function updateAmmoInputs() {
        const container = document.getElementById('u_ammo_inputs_container');
        if (!container) return;

        const existingValues = {};
        container.querySelectorAll('.u-ammo-qty').forEach(input => {
            existingValues[input.dataset.index] = input.value;
        });

        container.innerHTML = '';
        const rows = document.querySelectorAll('.weapon-row');

        rows.forEach((row, index) => {
            const wName = row.querySelector('.w-name').value.trim() || `Зброя №${index + 1}`;
            const aName = row.querySelector('.w-ammo').value.trim() || "набоїв";
            const oldVal = existingValues[index] !== undefined ? existingValues[index] : "0";

            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';
            formGroup.innerHTML = `
                <label>Кількість набоїв для ${wName} (${aName}):</label>
                <input type="number" class="u-ammo-qty" data-index="${index}" value="${oldVal}" min="0">
            `;
            container.appendChild(formGroup);
        });
    }

    function setUseResult(val) {
        document.getElementById('u_result').value = val;
        document.getElementById('btn_u_res_destroyed').classList.remove('active');
        document.getElementById('btn_u_res_not_destroyed').classList.remove('active');
        
        if (val === 'Знищено') {
            document.getElementById('btn_u_res_destroyed').classList.add('active');
            isNotDestroyedModalFilled = true;
        } else if (val === 'Не знищено') {
            document.getElementById('btn_u_res_not_destroyed').classList.add('active');
            isNotDestroyedModalFilled = false;
            openNotDestroyedModal();
        }
    }

    /* Логіка модального вікна "Не знищено" */
    function openNotDestroyedModal() {
        pendingModalText = "";
        
        document.getElementById('m_weapon_vkk').classList.remove('active');
        document.getElementById('m_weapon_pzrk').classList.remove('active');
        document.getElementById('m_reason_ndzh').classList.remove('active');
        document.getElementById('m_reason_selfdestruct').classList.remove('active');
        
        document.getElementById('modal_pzrk_reason_group').style.display = 'none';
        document.getElementById('modal_ok_btn').disabled = true;
        
        document.getElementById('not_destroyed_modal').style.display = 'flex';
    }

    function selectModalWeapon(type) {
        document.getElementById('m_weapon_vkk').classList.remove('active');
        document.getElementById('m_weapon_pzrk').classList.remove('active');
        document.getElementById('m_reason_ndzh').classList.remove('active');
        document.getElementById('m_reason_selfdestruct').classList.remove('active');
        
        if (type === 'vkk') {
            document.getElementById('m_weapon_vkk').classList.add('active');
            document.getElementById('modal_pzrk_reason_group').style.display = 'none';
            pendingModalText = "обстріл не наніс критичних пошкоджень";
            document.getElementById('modal_ok_btn').disabled = false;
        } else if (type === 'pzrk') {
            document.getElementById('m_weapon_pzrk').classList.add('active');
            document.getElementById('modal_pzrk_reason_group').style.display = 'block';
            pendingModalText = "";
            document.getElementById('modal_ok_btn').disabled = true;
        }
    }

    function selectModalReason(reason) {
        document.getElementById('m_reason_ndzh').classList.remove('active');
        document.getElementById('m_reason_selfdestruct').classList.remove('active');
        
        if (reason === 'ndzh') {
            document.getElementById('m_reason_ndzh').classList.add('active');
            pendingModalText = "не було захоплення цілі";
        } else if (reason === 'selfdestruct') {
            document.getElementById('m_reason_selfdestruct').classList.add('active');
            pendingModalText = "не спрацював підривач ГСН";
        }
        document.getElementById('modal_ok_btn').disabled = false;
    }

    function confirmModalSelection() {
        if (!pendingModalText) return;
        
        const commentInput = document.getElementById('f_comment');
        let currentVal = commentInput.value.trim();
        
        if (currentVal) {
            if (!currentVal.endsWith(',') && !currentVal.endsWith('.')) {
                commentInput.value = currentVal + ', ' + pendingModalText;
            } else {
                commentInput.value = currentVal + ' ' + pendingModalText;
            }
        } else {
            commentInput.value = pendingModalText;
        }
        
        isNotDestroyedModalFilled = true;
        document.getElementById('not_destroyed_modal').style.display = 'none';
    }

    function setTargetType(branch, typeName) {
        if (branch === 'use') {
            selectedUseType = typeName;
            document.querySelectorAll('#branch_use .btn-group-toggle')[1].querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn_u_${typeName === 'Шахед' ? 'shahed' : typeName === 'Гербера' ? 'gerbera' : 'rocket'}`).classList.add('active');
        } else {
            selectedFlightType = typeName;
            document.querySelectorAll('#branch_flight .toggle-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn_fl_${typeName === 'Шахед' ? 'shahed' : typeName === 'Гербера' ? 'gerbera' : 'rocket'}`).classList.add('active');
        }
    }

    function toggleAircraftNoIssue() {
        const isNoIssue = document.getElementById('o_aircraft_no_issue').checked;
        const numberInput = document.getElementById('o_aircraft_number');
        if (isNoIssue) {
            numberInput.value = '';
            numberInput.disabled = true;
            numberInput.style.opacity = '0.5';
        } else {
            numberInput.disabled = false;
            numberInput.style.opacity = '1';
        }
    }

    function setOtherType(typeName) {
        selectedOtherType = typeName;
        document.querySelectorAll('#other_types_grid .toggle-btn').forEach(b => b.classList.remove('active'));
        
        const map = {
            'Вибух': 'btn_o_vibuh', 'Вихід ППО': 'btn_o_ppo', 'Вихід ПЗРК': 'btn_o_pzrk',
            'Робота ЗУ': 'btn_o_zu', 'Робота Кулемета': 'btn_o_kul', 'Влучання': 'btn_o_pril', 
            'Свій Літак': 'btn_o_plane', 'Свій гелікоптер': 'btn_o_heli', 'Наслідки': 'btn_o_nasl'
        };
        document.getElementById(map[typeName]).classList.add('active');

        document.getElementById('o_target_num_wrapper').style.display = (typeName === 'Вибух') ? 'block' : 'none';
        if (typeName !== 'Вибух') {
            document.getElementById('o_target_num').value = '';
        }

        document.getElementById('o_naslidki_wrapper').style.display = (typeName === 'Наслідки') ? 'block' : 'none';
        document.getElementById('o_aircraft_number_wrapper').style.display = (typeName === 'Свій Літак' || typeName === 'Свій гелікоптер') ? 'block' : 'none';
        
        const qtyTypes = ['Вибух', 'Вихід ППО', 'Вихід ПЗРК', 'Наслідки', 'Влучання'];
        const qtyWrapper = document.getElementById('o_qty_wrapper');
        if (qtyTypes.includes(typeName)) {
            qtyWrapper.style.display = 'block';
        } else {
            qtyWrapper.style.display = 'none';
            document.getElementById('o_qty').value = '';
        }

        const courseInput = document.getElementById('o_course');
        const heightInput = document.getElementById('o_height');
        
        if (typeName === 'Свій Літак' || typeName === 'Свій гелікоптер') {
            courseInput.style.display = 'block';
            heightInput.style.display = 'block';
        } else {
            courseInput.style.display = 'none';
            courseInput.value = '';
            heightInput.style.display = 'none';
            heightInput.value = '';
            document.getElementById('o_aircraft_number').value = '';
            document.getElementById('o_aircraft_no_issue').checked = false;
            toggleAircraftNoIssue();
        }
    }

    function toggleTargetBV() {
        const isBV = document.getElementById('f_target_bv').checked;
        const targetInput = document.getElementById('f_target_num');
        if (isBV) {
            targetInput.value = '';
            targetInput.disabled = true;
            targetInput.style.opacity = '0.5';
        } else {
            targetInput.disabled = false;
            targetInput.style.opacity = '1';
        }
    }

    function switchReportBranch() {
        const type = document.getElementById('report_type').value;
        
        document.querySelectorAll('.dynamic-section').forEach(s => s.style.display = 'none');
        document.getElementById('target_num_wrapper').style.display = (type === 'other') ? 'none' : 'block';

        if (type === 'use') document.getElementById('branch_use').style.display = 'block';
        if (type === 'flight') document.getElementById('branch_flight').style.display = 'block';
        if (type === 'other') {
            document.getElementById('branch_other').style.display = 'block';
            setOtherType(selectedOtherType);
        }
        
        document.getElementById('result_block').style.display = 'none';
    }

    function buildFinalReport() {
        const branch = document.getElementById('report_type').value;
        
        const np = document.getElementById('h_np').value.trim().toUpperCase();
        const obl = document.getElementById('h_obl').value.trim();
        const unit = document.getElementById('h_unit').value.trim();
        const callsign = document.getElementById('h_callsign').value.trim();
        const soldiers = document.getElementById('h_soldiers').value.trim() || "-";

        const date = document.getElementById('f_date').value.trim();
        const hour = document.getElementById('f_hour').value.trim();
        const min = document.getElementById('f_min').value.trim();
        const timeFormatted = (hour || min) ? `${hour.padStart(2,'0')}:${min.padStart(2,'0')}` : '';
        
        const isBV = document.getElementById('f_target_bv').checked;
        const rawTargetNum = document.getElementById('f_target_num').value.trim();
        const targetNumOutput = (branch === 'other') ? null : (isBV ? "б/в" : rawTargetNum);
        
        let rawComment = document.getElementById('f_comment').value.trim();
        let finalReportText = "";

        if (branch === 'use') {
            const useResult = document.getElementById('u_result').value;
            if (!useResult) {
                alert('Будь ласка, оберіть результат: "Знищено" або "Не знищено"!');
                return;
            }

            if (useResult === 'Не знищено' && !isNotDestroyedModalFilled) {
                openNotDestroyedModal();
                return;
            }

            const weaponDetails = [];
            const weaponRows = document.querySelectorAll('.weapon-row');
            weaponRows.forEach(row => {
                const name = row.querySelector('.w-name').value.trim();
                const ammo = row.querySelector('.w-ammo').value.trim();
                if (name) {
                    if (ammo) weaponDetails.push(`${name} (${ammo})`);
                    else weaponDetails.push(name);
                }
            });
            const weaponsOutputText = weaponDetails.join(', ') || '-';

            /* Форматування результату залежно від вибору */
            const resText = (useResult === 'Знищено') ? 'ЗНИЩЕНО' : 'не знищено';

            const height = document.getElementById('u_height').value.trim();
            const azi = document.getElementById('u_azi').value.trim() || '-';
            const dist = document.getElementById('u_dist').value.trim() || '-';
            const course = document.getElementById('u_course').value.trim() || '-';

            const ammoParts = [];
            const qtyInputs = document.querySelectorAll('.u-ammo-qty');
            qtyInputs.forEach(input => {
                const idx = input.dataset.index;
                const row = weaponRows[idx];
                if (row) {
                    const wName = row.querySelector('.w-name').value.trim() || `Зброя №${parseInt(idx)+1}`;
                    const aName = row.querySelector('.w-ammo').value.trim() || "набоїв";
                    const qty = input.value.trim() || "0";
                    ammoParts.push(`${wName} (${aName}) - ${qty}`);
                }
            });
            const ammoOutputText = ammoParts.length > 0 ? "\n" + ammoParts.join('\n') : " -";

            const description = `А-${azi}, Д-${dist}, К-${course}, обстріляно 1 ${selectedUseType}, ${soldiers}`;
            let finalComment = rawComment ? rawComment : "-";

            finalReportText = 
`Дата: ${date}
Час: ${timeFormatted}
№ цілі: ${targetNumOutput}
Результат: ${resText}
Н.П.: ${np}
Обл.: ${obl}
Підрозділ: ${unit}
Позивний: ${callsign}
Зброя: ${weaponsOutputText}
Висота: ${height || '-'}
Опис: ${description}
Коментар: ${finalComment}
Набої:${ammoOutputText}`;
        }

        else if (branch === 'flight') {
            const resText = document.getElementById('fl_result').value.trim();
            
            let methods = [];
            if(document.getElementById('fl_acous').checked) methods.push("акустично");
            if(document.getElementById('fl_vis').checked) methods.push("візуально");
            const methodSuffix = methods.length > 0 ? ` (${methods.join(', ')})` : "";

            const azi = document.getElementById('fl_azi').value.trim() || '-';
            const dist = document.getElementById('fl_dist').value.trim() || '-';
            const course = document.getElementById('fl_course').value.trim() || '-';
            const height = document.getElementById('fl_height').value.trim();

            const description = `А-${azi}, Д-${dist}, К-${course}, виявлено 1 ${selectedFlightType}${methodSuffix}`;
            let finalComment = rawComment ? rawComment : "-";

            finalReportText = 
`Дата: ${date}
Час: ${timeFormatted}
№ цілі: ${targetNumOutput}
Результат: ${resText}
Н.П.: ${np}
Обл.: ${obl}
Підрозділ: ${unit}
Позивний: ${callsign}
Висота: ${height || '-'}
Опис: ${description}
Коментар: ${finalComment}`;
        }

        else if (branch === 'other') {
            const resText = document.getElementById('o_result_static').value;
            const oTargetNum = document.getElementById('o_target_num').value.trim();
            const targetNumLine = (selectedOtherType === 'Вибух') ? `\n№ цілі: ${oTargetNum}` : '';

            let methods = [];
            if(document.getElementById('o_acous').checked) methods.push("акустично");
            if(document.getElementById('o_vis').checked) methods.push("візуально");
            const methodSuffix = methods.length > 0 ? ` (${methods.join(', ')})` : "";

            const azi = document.getElementById('o_azi').value.trim() || '-';
            const dist = document.getElementById('o_dist').value.trim() || '-';
            const course = document.getElementById('o_course').value.trim() || '-';
            const height = document.getElementById('o_height').value.trim();

            let typeDisplay = selectedOtherType;
            if (selectedOtherType === 'Наслідки') {
                const naslText = document.getElementById('o_naslidki_text').value.trim() || "не вказано";
                typeDisplay = `Наслідки (${naslText})`;
            }

            if (selectedOtherType === 'Свій Літак' || selectedOtherType === 'Свій гелікоптер') {
                const acNum = document.getElementById('o_aircraft_number').value.trim();
                const isNoIssue = document.getElementById('o_aircraft_no_issue').checked;
                
                if (isNoIssue) {
                    typeDisplay = `${selectedOtherType} без видачі`;
                } else if (acNum) {
                    typeDisplay = `${selectedOtherType} ${acNum}`;
                }
            }

            let description = `А-${azi}, Д-${dist}`;
            if (selectedOtherType === 'Свій Літак' || selectedOtherType === 'Свій гелікоптер') {
                description += `, К-${course}`;
            }
            description += `, виявлено ${typeDisplay}${methodSuffix}`;

            let finalComment = rawComment;
            const qtyTypes = ['Вибух', 'Вихід ППО', 'Вихід ПЗРК', 'Наслідки', 'Влучання'];
            if (qtyTypes.includes(selectedOtherType)) {
                const qty = document.getElementById('o_qty').value.trim();
                if (qty) {
                    if (finalComment) {
                        finalComment += `, к-сть: ${qty} шт`;
                    } else {
                        finalComment = `к-сть: ${qty} шт`;
                    }
                }
            }
            if (!finalComment) finalComment = "-";

            finalReportText = 
`Дата: ${date}
Час: ${timeFormatted}${targetNumLine}
Результат: ${resText}
Н.П.: ${np}
Обл.: ${obl}
Підрозділ: ${unit}
Позивний: ${callsign}
Висота: ${height || '-'}
Опис: ${description}
Коментар: ${finalComment}`;
        }

        document.getElementById('final_text').value = finalReportText;
        document.getElementById('result_block').style.display = 'block';
        document.getElementById('result_block').scrollIntoView({ behavior: 'smooth' });
    }

    function copyFinalReport() {
        const targetTextarea = document.getElementById('final_text');
        targetTextarea.focus();
        targetTextarea.select();
        targetTextarea.setSelectionRange(0, 99999);

        let copied = false;
        try { copied = document.execCommand('copy'); } catch (err) { copied = false; }

        if (!copied && navigator.clipboard) {
            navigator.clipboard.writeText(targetTextarea.value)
                .then(() => showToast())
                .catch(() => alert('Текст виділено — натисніть Ctrl+C.'));
        } else if (copied) {
            showToast();
        }
    }

    function resetDynamicFields() {
        setCurrentDateTime();
        document.getElementById('f_target_num').value = '';
        document.getElementById('f_target_bv').checked = false;
        toggleTargetBV();
        document.getElementById('f_comment').value = '';

        setUseResult('');
        isNotDestroyedModalFilled = false;
        document.getElementById('not_destroyed_modal').style.display = 'none';

        setTargetType('use', 'Шахед');
        document.getElementById('u_height').value = '';
        document.getElementById('u_azi').value = '';
        document.getElementById('u_dist').value = '';
        document.getElementById('u_course').value = '';
        document.querySelectorAll('.u-ammo-qty').forEach(input => input.value = '0');

        document.getElementById('fl_result').value = 'Виявлено';
        document.getElementById('fl_acous').checked = true;
        document.getElementById('fl_vis').checked = false;
        setTargetType('flight', 'Шахед');
        document.getElementById('fl_azi').value = '';
        document.getElementById('fl_dist').value = '';
        document.getElementById('fl_course').value = '';
        document.getElementById('fl_height').value = '';

        setOtherType('Вибух');
        document.getElementById('o_target_num').value = '';
        document.getElementById('o_qty').value = '';
        document.getElementById('o_naslidki_text').value = '';
        document.getElementById('o_acous').checked = true;
        document.getElementById('o_vis').checked = false;
        document.getElementById('o_azi').value = '';
        document.getElementById('o_dist').value = '';
        document.getElementById('o_course').value = '';
        document.getElementById('o_height').value = '';
        document.getElementById('o_aircraft_number').value = '';
        document.getElementById('o_aircraft_no_issue').checked = false;
        toggleAircraftNoIssue();

        document.getElementById('result_block').style.display = 'none';
        
        setMainReportType('other');
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
</script>

</body>
